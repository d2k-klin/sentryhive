name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=sentryhive --cov-report=xml --cov-report=term-missing
        # NOTE: no AWS credentials anywhere — tests use mocks/fixtures only.
      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  scanner-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install SentryHive
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
      - name: Install bundled scanners
        run: |
          eval "$(grep -E '^ARG (PROWLER|CLOUDSPLAINING|HARDENEKS|ASH|CLOUDFOX|KUBESCAPE)_VERSION=' Dockerfile | sed 's/^ARG //')"
          python -m venv "$RUNNER_TEMP/scanner-venv"
          "$RUNNER_TEMP/scanner-venv/bin/pip" install --upgrade pip "setuptools>=83"
          "$RUNNER_TEMP/scanner-venv/bin/pip" install \
            "prowler==$PROWLER_VERSION" \
            "cloudsplaining==$CLOUDSPLAINING_VERSION" \
            "hardeneks==$HARDENEKS_VERSION" \
            "automated-security-helper @ git+https://github.com/awslabs/automated-security-helper.git@v$ASH_VERSION"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL "https://github.com/BishopFox/cloudfox/releases/download/v${CLOUDFOX_VERSION}/cloudfox-linux-amd64.zip" \
            -o "$RUNNER_TEMP/cloudfox.zip"
          unzip -q "$RUNNER_TEMP/cloudfox.zip" -d "$RUNNER_TEMP/cloudfox"
          install -m 0755 "$RUNNER_TEMP/cloudfox/cloudfox/cloudfox" "$RUNNER_TEMP/bin/cloudfox"
          curl -sSL "https://github.com/kubescape/kubescape/releases/download/v${KUBESCAPE_VERSION}/kubescape_${KUBESCAPE_VERSION}_linux_amd64" \
            -o "$RUNNER_TEMP/bin/kubescape"
          chmod +x "$RUNNER_TEMP/bin/kubescape"
          echo "$RUNNER_TEMP/scanner-venv/bin" >> "$GITHUB_PATH"
      - name: Install pinned AWS CLI and kubectl
        run: |
          AWSCLI_VERSION="$(grep -E '^ARG AWSCLI_VERSION=' Dockerfile | cut -d= -f2)"
          KUBECTL_VERSION="$(grep -E '^ARG KUBECTL_VERSION=' Dockerfile | cut -d= -f2)"
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWSCLI_VERSION}.zip" -o "$RUNNER_TEMP/awscliv2.zip"
          unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/aws/install" --install-dir "$RUNNER_TEMP/aws-cli" --bin-dir "$RUNNER_TEMP/bin"
          curl -sSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            -o "$RUNNER_TEMP/bin/kubectl"
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify scanner versions
        env:
          SENTRYHIVE_SCANNER_PYTHON: ${{ runner.temp }}/scanner-venv/bin/python
        run: ./scripts/verify-scanners.sh
      - name: Audit scanner dependencies
        run: |
          pip install pip-audit
          SCANNER_SITE="$("$RUNNER_TEMP/scanner-venv/bin/python" -c 'import site; print(site.getsitepackages()[0])')"
          # Prowler 5.36.0 pins cryptography 46.0.7; remove this exception as soon as upstream permits 48.0.1+.
          pip-audit --path "$SCANNER_SITE" --ignore-vuln GHSA-537c-gmf6-5ccf

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Docker image
        run: docker build -t sentryhive:ci .
      - name: Smoke test
        run: docker run --rm sentryhive:ci --version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build Python package
        run: |
          pip install build
          python -m build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pdf]"
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit
