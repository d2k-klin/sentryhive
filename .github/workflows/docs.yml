name: Docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", "docs/**"]
  pull_request:
    paths: ["**/*.md", "docs/**"]

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Check local + repo links; ignore example/placeholder hosts and anchors-only.
          args: >-
            --no-progress
            --exclude '^https://github.com/d2k-klin/sentryhive'
            --exclude '123456789012'
            './**/*.md'
          fail: true
